[workspace]
members = ["crates/*"]
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Yusuf Toktaş"]
repository = "https://github.com/yusuf-toktas/wasm-dap"
homepage = "https://github.com/yusuf-toktas/wasm-dap"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
gimli = { version = "0.33", default-features = false, features = ["read", "std", "endian-reader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmparser = "0.254"
wasmprinter = "0.254"
wasmtime = "48.0.8"
wasmtime-wasi = "48.0.8"
wat = { version = "1.258", features = ["dwarf"] }

wasm-dap-core = { path = "crates/wasm-dap-core", version = "0.1.0" }
wasm-dap-protocol = { path = "crates/wasm-dap-protocol", version = "0.1.0" }
wasm-dap-testkit = { path = "crates/wasm-dap-testkit" }
